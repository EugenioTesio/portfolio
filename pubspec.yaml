name: portfolio
version: 1.0.0+1
publish_to: none
description: Portfolio developed in flutter.
environment:
  sdk: ^3.13.0

dependencies:
  animated_glitch: ^2.0.0+2
  auto_size_text_plus: ^3.0.2
  collection: ^1.19.1
  firebase_core: ^4.14.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  riverpod_annotation: ^4.0.6
  seo: ^0.0.10
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  patrol: ^4.9.0
  patrol_finders: ^3.6.0
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8

flutter:
  assets:
    - assets/images/
    - assets/projects/
  uses-material-design: true
  generate: true

fonts:
  - family: Nunito
    fonts:
      - asset: assets/fonts/nunito/Nunito-Italic-VariableFont_wght.ttf
        style: italic
      - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
      - asset: assets/fonts/nunito/static/Nunito-Regular.ttf

patrol:
  app_name: portfolio
  android:
    package_name: com.example.portfolio
  ios:
    bundle_id: com.example.portfolio

dependency_overrides:
  # flutter_html 3.0.0 calls html/src/query_selector.matches, removed in html 0.15.6+.
  html: 0.15.5+1
